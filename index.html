<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обертка календаря</title>
    <style>
        /* Убираем отступы, чтобы iframe занимал все доступное место */
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        /* iframe растягивается по ширине, высоту будет регулировать скрипт */
        iframe { 
            border: 0; 
            width: 100%; 
            height: 100vh; /* Начальная высота, скрипт ее скорректирует */
        }
    </style>
</head>
<body>
    <!-- Сюда подставляем ссылку на ваш основной файл календаря -->
    <iframe id="myCalendar" src=calendar.html scrolling="no"></iframe>

    <!-- Подключаем библиотеку iframe-resizer -->
    <script src="https://cdn.jsdelivr.net/npm/iframe-resizer@4.3.11/js/iframeResizer.min.js"></script>
    <script>
        // Запускаем ресайзер для нашего iframe
        iFrameResize({ log: false }, '#myCalendar');
    </script>
</body>
</html>
